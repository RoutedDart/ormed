dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build_runner: ^2.16.0
  driver_tests: ">=0.2.0 <1.0.0"

dependency_overrides:
  ormed:
    path: ../ormed
  ormed_sqlite_core:
    path: ../ormed_sqlite_core
