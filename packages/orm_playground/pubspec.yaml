name: orm_playground
description: A sample command-line application.
version: 0.3.0
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"
# Add regular dependencies here.
dependencies:
  path: ^1.9.1
  ormed:
    path: ../ormed
  ormed_sqlite: ">=0.3.0 <1.0.0"
  ormed_cli: ">=0.2.1 <1.0.0"
